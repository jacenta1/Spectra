<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="spectra-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="spectra-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8" />
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Hexagon / Prism -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#121316" stroke="url(#spectra-grad-1)" stroke-width="2.5" />
  
  <!-- Outer Prism Rays (Spectra Refraction) -->
  <path d="M 30 60 L 60 25 L 90 60 L 60 95 Z" fill="none" stroke="url(#spectra-grad-1)" stroke-width="2.5" opacity="0.4" />
  
  <!-- Core Hexagonal Shard -->
  <polygon points="60,35 82,48 82,72 60,85 38,72 38,48" fill="url(#spectra-grad-1)" opacity="0.2" />
  
  <!-- Center Core Node & Data Vectors (0G Observation Layer) -->
  <circle cx="60" cy="60" r="12" fill="url(#spectra-grad-1)" filter="url(#blur-glow)" />
  <circle cx="60" cy="60" r="6" fill="#FFFFFF" />

  <!-- Verification Pulse Rings -->
  <circle cx="60" cy="60" r="28" fill="none" stroke="url(#spectra-glow)" stroke-width="1.5" stroke-dasharray="6 4" />
  
  <!-- 0G Satellite Anchors -->
  <circle cx="60" cy="25" r="3.5" fill="#3B82F6" />
  <circle cx="90" cy="60" r="3.5" fill="#10B981" />
  <circle cx="60" cy="95" r="3.5" fill="#6366F1" />
  <circle cx="30" cy="60" r="3.5" fill="#38BDF8" />
</svg>
